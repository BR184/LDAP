services:
  mysql:
    image: mysql:8.0
    container_name: corp-idm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: corp_idm
      MYSQL_USER: corp_idm
      MYSQL_PASSWORD: corp_idm
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql

  openldap:
    image: osixia/openldap:1.5.0
    container_name: corp-idm-openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: corp
      LDAP_DOMAIN: corp.local
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
      - ./openldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: corp-idm-gitlab-test
    hostname: corp-idm-gitlab-test
    restart: unless-stopped
    shm_size: "256m"
    environment:
      TZ: Asia/Shanghai
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://127.0.0.1:8929'
        nginx['listen_port'] = 8929
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        letsencrypt['enable'] = false
        gitlab_rails['ldap_enabled'] = true
        gitlab_rails['prevent_ldap_sign_in'] = false
        gitlab_rails['ldap_servers'] = {
          'main' => {
            'label' => 'Corp LDAP',
            'host' => 'host.docker.internal',
            'port' => 3389,
            'uid' => 'employeeNumber',
            'bind_dn' => 'cn=admin,dc=corp,dc=local',
            'password' => 'admin',
            'encryption' => 'plain',
            'verify_certificates' => false,
            'timeout' => 10,
            'active_directory' => false,
            'allow_username_or_email_login' => false,
            'block_auto_created_users' => false,
            'base' => 'ou=people,dc=corp,dc=local',
            'user_filter' => '(&(objectClass=inetOrgPerson)(employeeType=ENABLED))',
            'attributes' => {
              'username' => ['employeeNumber'],
              'email' => ['mail'],
              'name' => 'cn'
            }
          }
        }
    ports:
      - "8929:8929"
      - "2224:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

volumes:
  mysql-data:
  openldap-data:
  openldap-config:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
