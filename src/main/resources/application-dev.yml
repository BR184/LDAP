server:
  port: ${APP_SERVER_PORT:8081}

spring:
  datasource:
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3307/corp_idm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${APP_DB_USERNAME:corp_idm}
    password: ${APP_DB_PASSWORD:corp_idm}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${APP_DB_MAX_POOL_SIZE:15}
      minimum-idle: ${APP_DB_MIN_IDLE:5}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:5000}
  h2:
    console:
      enabled: false

app:
  ldap:
    mode: spring
    url: ${APP_LDAP_URL:ldap://127.0.0.1:3389}
    bind-dn: ${APP_LDAP_BIND_DN:cn=admin,dc=corp,dc=local}
    bind-password: ${APP_LDAP_BIND_PASSWORD:admin}
  startup-check:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
