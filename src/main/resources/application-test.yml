# test 环境：
# 1. 供测试、验收和回归使用
# 2. 使用真实 MySQL + OpenLDAP，但配置更偏向稳定回归
spring:
  datasource:
    # 默认指向测试库，避免误连开发库。
    url: ${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/corp_idm_test?useUnicode=true&characterEncoding=utf8mb4&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${APP_DB_USERNAME:corp_idm}
    password: ${APP_DB_PASSWORD:corp_idm}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 测试环境连接池略小于开发环境，优先保证回归稳定性。
      maximum-pool-size: ${APP_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${APP_DB_MIN_IDLE:3}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:5000}
  h2:
    console:
      enabled: false

app:
  ldap:
    # 测试环境使用真实 LDAP，验证目录联动行为。
    mode: spring
    url: ${APP_LDAP_URL:ldap://127.0.0.1:389}
    bind-dn: ${APP_LDAP_BIND_DN:cn=admin,dc=corp,dc=local}
    bind-password: ${APP_LDAP_BIND_PASSWORD:admin}
  startup-check:
    # 测试环境默认开启启动校验，避免回归建立在错误环境上。
    enabled: true

springdoc:
  api-docs:
    # 测试环境保留接口文档，便于测试联调。
    enabled: true
  swagger-ui:
    enabled: true
