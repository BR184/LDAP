# 公共配置文件：
# 1. 所有 profile 都会加载
# 2. 这里只放环境无关的通用配置
# 3. 环境差异请放到 application-{profile}.yml
spring:
  application:
    name: corp-idm-platform
  profiles:
    # 默认使用 dev，便于当前联调环境直接启动。
    default: dev
  flyway:
    # 数据库迁移脚本统一放在 classpath:db/migration。
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
  jackson:
    # JSON 序列化时忽略 null 字段，保持响应简洁。
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    # 开启下划线到驼峰自动映射，减少 DO 字段手工配置。
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 仅在授权场景下展示健康检查详情，避免泄露过多运行信息。
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  mail:
    security:
      # 管理员在后台保存邮件密码时，使用该主密钥做对称加密；未配置时禁止保存或使用数据库邮件配置。
      secret-key: ${APP_MAIL_SECURITY_SECRET_KEY:huayun1234567890}
  jwt:
    # JWT 密钥优先从环境变量读取，默认值仅用于原型环境。
    secret: ${APP_JWT_SECRET:prototype-secret-prototype-secret-prototype-secret}
    expire-minutes: ${APP_JWT_EXPIRE_MINUTES:30}
  personal-access-token:
    max-active-per-user: ${APP_PAT_MAX_ACTIVE_PER_USER:20}
    last-used-write-interval-seconds: ${APP_PAT_LAST_USED_WRITE_INTERVAL_SECONDS:300}
  sql-log:
    # SQL 日志默认开启，便于当前阶段联调和问题排查。
    enabled: ${APP_SQL_LOG_ENABLED:true}
    slow-sql-threshold-ms: ${APP_SQL_LOG_SLOW_THRESHOLD_MS:200}
    show-parameters: ${APP_SQL_LOG_SHOW_PARAMETERS:true}
    max-sql-length: ${APP_SQL_LOG_MAX_SQL_LENGTH:2000}
    max-parameter-length: ${APP_SQL_LOG_MAX_PARAMETER_LENGTH:128}
    max-collection-length: ${APP_SQL_LOG_MAX_COLLECTION_LENGTH:5}
    mask-keywords:
      # 这些关键字命中的参数值在日志中会自动脱敏。
      - password
      - pwd
      - secret
      - token
      - credential
      - bindPassword
  ldap:
    # LDAP 目录树公共配置，stub 和 spring 两种模式共用。
    base-dn: ${APP_LDAP_BASE_DN:dc=corp,dc=local}
    people-ou: ${APP_LDAP_PEOPLE_OU:ou=people}
    groups-ou: ${APP_LDAP_GROUPS_OU:ou=groups}
  startup-check:
    # 启动校验默认关闭，真实环境在 profile 中显式开启。
    enabled: false
    verify-placeholder-user: true
    placeholder-uid: placeholder
    db-validation-timeout-seconds: 2
  password-reset:
    # 密码重置邮件的默认主题与提示文案，可通过环境变量覆盖。
    mail-subject: ${APP_PASSWORD_RESET_MAIL_SUBJECT:统一身份管理平台密码重置通知}
    mail-from: ${APP_PASSWORD_RESET_MAIL_FROM:}
    forgot-password-success-notice: ${APP_PASSWORD_RESET_FORGOT_NOTICE:如账号信息有效，系统已向绑定内网邮箱发送重置邮件，请注意查收}
    username-cooldown-seconds: ${APP_PASSWORD_RESET_USERNAME_COOLDOWN_SECONDS:300}
    ip-window-seconds: ${APP_PASSWORD_RESET_IP_WINDOW_SECONDS:300}
    ip-max-attempts: ${APP_PASSWORD_RESET_IP_MAX_ATTEMPTS:10}
  sync:
    feishu:
      # 飞书开放平台接入配置。
      enabled: ${APP_SYNC_FEISHU_ENABLED:true}
      base-url: ${APP_SYNC_FEISHU_BASE_URL:https://open.feishu.cn}
      app-id: ${APP_SYNC_FEISHU_APP_ID:}
      app-secret: ${APP_SYNC_FEISHU_APP_SECRET:}
      page-size: ${APP_SYNC_FEISHU_PAGE_SIZE:50}
      connect-timeout-ms: ${APP_SYNC_FEISHU_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${APP_SYNC_FEISHU_READ_TIMEOUT_MS:10000}
      file-import:
        # 手工文件导入默认开启，用于内网开发和应急补录。
        enabled: ${APP_SYNC_FEISHU_FILE_IMPORT_ENABLED:true}
        root-dir: ${APP_SYNC_FEISHU_FILE_IMPORT_ROOT_DIR:docs/feishu-import}
        max-file-size-bytes: ${APP_SYNC_FEISHU_FILE_IMPORT_MAX_SIZE:2097152}
        max-recovery-files: ${APP_SYNC_FEISHU_FILE_IMPORT_MAX_RECOVERY_FILES:1000}
    schedule:
      # 同步定时任务默认关闭，避免在原型环境或首次部署时误触发。
      feishu:
        enabled: false
        cron: "0 0 2 * * *"
      reconcile:
        enabled: false
        cron: "0 30 2 * * *"
        auto-repair: true

