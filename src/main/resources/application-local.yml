# local 环境：
# 1. 供开发人员本机快速联调
# 2. 使用 H2 + LDAP stub，不依赖真实外部服务
spring:
  datasource:
    # H2 以内存库方式启动，并开启 MySQL 兼容模式。
    url: jdbc:h2:mem:idm;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      # 本地调试时允许打开 H2 控制台查看数据。
      enabled: true

app:
  ldap:
    # 本地默认使用 stub LDAP，避免开发时必须依赖真实 OpenLDAP。
    mode: stub
    stub-users:
      # 预置本地管理员账号，便于快速登录调试。
      admin: admin123456

springdoc:
  api-docs:
    # 本地默认开放接口文档。
    enabled: true
  swagger-ui:
    enabled: true
