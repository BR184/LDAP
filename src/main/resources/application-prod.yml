# prod 环境：
# 1. 正式生产环境
# 2. 所有敏感配置必须由外部环境变量注入
spring:
  datasource:
    # 生产环境不提供默认值，缺失时应直接启动失败。
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 生产环境连接池相对更大，以支撑更高并发。
      maximum-pool-size: ${APP_DB_MAX_POOL_SIZE:30}
      minimum-idle: ${APP_DB_MIN_IDLE:8}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:5000}
  h2:
    console:
      enabled: false

app:
  ldap:
    # 生产环境强制使用真实 LDAP，且不提供默认连接信息。
    mode: spring
    url: ${APP_LDAP_URL}
    bind-dn: ${APP_LDAP_BIND_DN}
    bind-password: ${APP_LDAP_BIND_PASSWORD}
  startup-check:
    # 生产环境启动时必须做数据库和 LDAP 基础校验。
    enabled: true

springdoc:
  api-docs:
    # 生产环境默认关闭 Swagger，减少暴露面。
    enabled: false
  swagger-ui:
    enabled: false

management:
  health:
    # 邮件服务是可选能力；未配置 SMTP 时不得影响平台整体健康状态。
    mail:
      enabled: false
